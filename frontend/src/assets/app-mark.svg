<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="app-mark-title app-mark-desc">
  <title id="app-mark-title">Video VLM Analysis</title>
  <desc id="app-mark-desc">视频画面与场景时间轴组合标识</desc>
  <defs>
    <linearGradient id="mark-bg" x1="16" y1="16" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#001529"/>
      <stop offset="0.55" stop-color="#0958d9"/>
      <stop offset="1" stop-color="#13c2c2"/>
    </linearGradient>
    <linearGradient id="mark-screen" x1="38" y1="42" x2="122" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7f7ff"/>
    </linearGradient>
    <filter id="mark-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#001529" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="160" height="160" rx="36" fill="url(#mark-bg)"/>
  <g filter="url(#mark-shadow)">
    <rect x="30" y="34" width="100" height="68" rx="14" fill="url(#mark-screen)"/>
    <path d="M70 51L96 68L70 85V51Z" fill="#0958d9"/>
    <circle cx="47" cy="47" r="4" fill="#13c2c2"/>
    <circle cx="60" cy="47" r="4" fill="#69c0ff"/>
    <circle cx="73" cy="47" r="4" fill="#ffd666"/>
    <rect x="30" y="117" width="35" height="11" rx="5.5" fill="#69c0ff"/>
    <rect x="70" y="117" width="28" height="11" rx="5.5" fill="#52c41a"/>
    <rect x="103" y="117" width="27" height="11" rx="5.5" fill="#ffd666"/>
  </g>
  <path d="M31 22H59" stroke="#ffffff" stroke-opacity="0.42" stroke-width="4" stroke-linecap="round"/>
</svg>
